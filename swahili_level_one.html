<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <title>Vietnamese Pronouns</title>
  <style>
  body {
    font-family: "Press Start 2P", cursive;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    height: 100vh;
    background-color: #f0f8ff;
    background-image: url('swahili_backg.png');
    background-repeat: no-repeat;
    background-size: cover;
    background-position: center;
    cursor: url('lantern.png'), auto;
  }

  #parrot-container {
    width: 30%;
    text-align: center;
  }

  #question-container {
    width: 70%;
    padding: 20px;
    bottom: 185px;
    left: -50px;
  }

  img {
    width: 200px;
    height: auto;
  }

  .question {
    margin-bottom: 20px;
  }

  .options button {
    display: block;
    margin: 10px 0;
    padding: 10px;
    font-size: 16px;
    cursor: pointer;
    border: 1px solid #ccc;
    border-radius: 5px;
  }

  .summary {
    display: none;
    text-align: center;
  }

  .star-container img {
    width: 50px;
    margin: 5px;
  }

 #parrotstick-container {
  position: absolute;
  bottom: 185px;
  left: -100px;  
  }

#parrotstick-container img {
  width: 600px;
  height: auto;
  }

  #springbok-container {
    position: absolute;
    bottom: -400px; /* Start off-screen */
    left: 10px; /* Initial position */
    width: 400px;
  }

  #springbok {
    width: 400px;
    height: auto;
    position: relative;
  }


</style>

</head>
<body>
  <div id="parrot-container">
    <img id="parrot" src="language_parrot_idle.gif" alt="Parrot">
  </div>

  <div id="question-container">
    <div id="quiz">
      <div id="question" class="question"></div>
      <div id="options" class="options"></div>
    </div>

    <div id="parrotstick-container">
      <img src="stick1.png" alt="Stick">
  </div>

    <div id="summary" class="summary">
      <div id="star-container" class="star-container"></div>
      <div id="parrot-summary"></div>
    </div>
  </div>

  <div id="springbok-container">
    <img id="springbok" src="springbok.gif" alt="Springbok">
  </div>

  <script>
    const questions = [
     { q: "Hello means", options: ["Kwaheri", "Habari", "Mchana mwema", "Jioni njema"], answer: "Habari" },
     { q: "Goodbye means", options: ["Habari", "Usiku mwema", "Kwaheri", "Habari yako"], answer: "Kwaheri" },
     { q: "Good morning means", options: ["Habari za asubuhi", "Jioni njema", "Mchana mwema", "Usiku mwema"], answer: "Habari za asubuhi" },
     { q: "Good afternoon means", options: ["Mchana mwema", "Habari", "Habari yako", "Kwaheri"], answer: "Mchana mwema" },
     { q: "Good evening means", options: ["Jioni njema", "Habari", "Mchana mwema", "Habari yako"], answer: "Jioni njema" },
     { q: "Good night means", options: ["Usiku mwema", "Habari za asubuhi", "Jioni njema", "Habari yako"], answer: "Usiku mwema" },
     { q: "How are you", type: "input", placeholder: "___ yako?", answer: ["Habari", "habari"] },
     { q: "Say 'Good evening' in Swahili", type: "input", placeholder: "___ njema", answer: ["Jioni", "jioni"] },
     { q: "Say 'Good night' in Swahili", type: "input", placeholder: "___ mwema", answer: ["Usiku", "usiku"] },
     { q: "Say 'Good afternoon' in Swahili", type: "input", placeholder: "___ mwema", answer: ["Mchana", "mchana"] }
];


    let currentQuestion = 0;
    let score = 0;

    const parrot = document.getElementById("parrot");
    const questionDiv = document.getElementById("question");
    const optionsDiv = document.getElementById("options");
    const summaryDiv = document.getElementById("summary");
    const starContainer = document.getElementById("star-container");

    function loadQuestion() {
      const q = questions[currentQuestion];
      questionDiv.textContent = q.q;
      optionsDiv.innerHTML = "";

      if (q.type === "input") {
        const input = document.createElement("input");
        input.placeholder = q.placeholder;
        const submitButton = document.createElement("button");
        submitButton.textContent = "Submit";
        submitButton.onclick = () => checkAnswer(input.value);
        optionsDiv.appendChild(input);
        optionsDiv.appendChild(submitButton);
      } else {
        q.options.forEach(option => {
          const button = document.createElement("button");
          button.textContent = option;
          button.onclick = () => checkAnswer(option);
          optionsDiv.appendChild(button);
        });
      }
    }

    function checkAnswer(answer) {
      const q = questions[currentQuestion];
      const isCorrect = Array.isArray(q.answer) ? q.answer.includes(answer) : answer === q.answer;

      if (isCorrect) {
        score++;
        parrot.src = "language_parrot_happy.gif";

        // Play the correct sound effect
        const correctSound = new Audio("swahili_correct.mp3");
        correctSound.play();
      } else {
        parrot.src = "language_parrot_unhappy.gif";

        // Play the wrong sound effect
        const wrongSound = new Audio("swahili_wrong.mp3");
        wrongSound.play();
      }

      currentQuestion++;
      if (currentQuestion < questions.length) {
        setTimeout(() => {
          parrot.src = "language_parrot_idle.gif";
          loadQuestion();
        }, 1000);
      } else {
        showSummary();
      }
    }

    function showSummary() {
      document.getElementById("quiz").style.display = "none";
      summaryDiv.style.display = "block";
      starContainer.innerHTML = "";

      let starCount = 0;
      if (score >= 8) starCount = 5;
      else if (score >= 5) starCount = 3;
      else starCount = 1;

      for (let i = 0; i < starCount; i++) {
        const star = document.createElement("img");
        star.src = "parrot_star.gif";
        starContainer.appendChild(star);
      }

      const summaryParrot = document.createElement("img");
      summaryParrot.src = score >= 5 ? "language_parrot_happy.gif" : "language_parrot_unhappy.gif";
      const message = document.createElement("p");
      message.textContent = score >= 5 ? "Congrats!" : "Try harder!";
      summaryDiv.appendChild(summaryParrot);
      summaryDiv.appendChild(message);
    }

    loadQuestion();

    //springbok code:
    function springbokJump() {
  const springbok = document.getElementById("springbok-container");
  let leftPosition = Math.random() * (window.innerWidth - 400); // Random X position
  springbok.style.left = `${leftPosition}px`;

  // Animate the springbok
  springbok.style.transition = "bottom 0.8s ease-out, left 0.8s linear";
  springbok.style.bottom = "800px"; // Jump height

  setTimeout(() => {
    springbok.style.bottom = "-400px"; // Falls back down
  }, 800);
}

// Make the springbok jump every few seconds
setInterval(springbokJump, Math.random() * 3000 + 1500); // Jumps every 3-8 seconds randomly

setTimeout(() => {
  springbok.style.bottom = "-400px"; // Falls back down
  springbok.style.left = `${leftPosition + 50}px`; // Moves slightly forward
}, 800);
  </script>
</body>
</html>
